{% extends 'base.html' %}

{% block title %}Sign In - WAMS Gym{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="card"
        style="width: 100%; max-width: 400px; padding: 3rem; background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.15);">
        <h1
            style="text-align: center; border: none; font-size: 2rem; margin-bottom: 2rem; text-transform: capitalize; color: white;">
            Sign In</h1>

        <form method="post" action="/auth/login/">
            {% csrf_token %}

            {% if error %}
            <div class="message message-error" style="text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <div style="position: relative;">
                <label for="username" style="display: none;">Username</label>
                <!-- SVG Icon for User/Email could go here -->
                <input type="text" name="username" id="username" placeholder="Username" required
                    style="width: 100%; box-sizing: border-box; padding-left: 15px; background: rgba(0,0,0,0.4); border-color: #444;">
            </div>

            <div style="position: relative;">
                <label for="password" style="display: none;">Password</label>
                <input type="password" name="password" id="password" placeholder="Password" required
                    style="width: 100%; box-sizing: border-box; padding-left: 15px; background: rgba(0,0,0,0.4); border-color: #444;">
            </div>

            <button type="submit" style="width: 100%; margin-top: 10px; font-size: 1.1rem;">Login</button>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account?</p>
            <a href="/auth/register"
                style="color: var(--primary); text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.9rem;">Sign
                Up</a>
        </div>
    </div>
</div>
{% endblock %}
