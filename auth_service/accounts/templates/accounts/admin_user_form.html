{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1>{% if object %}Edit User{% else %}Add User{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        <!-- Simple rendering of form fields -->
        {% for field in form %}
        <div style="margin-bottom: 15px;">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div style="color: #ff4444; font-size: 0.8rem;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Save</button>
            <a href="{% url 'admin-user-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
