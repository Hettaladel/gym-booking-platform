{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
    <h1>Confirm Deletion</h1>
    <p>Are you sure you want to delete the user "{{ object.username }}"?</p>
    <form method="post">
        {% csrf_token %}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn" style="background-color: #ff4444;">Confirm Delete</button>
            <a href="{% url 'admin-user-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
