{% extends 'base.html' %}

{% block title %}Edit Session - WAMS Gym{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1>Edit Session: {{ session.course.title }}</h1>
    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label for="start_datetime">Start Date & Time</label>
            <input type="datetime-local" id="start_datetime" name="start_datetime"
                value="{{ session.start_datetime|date:'Y-m-d\TH:i' }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="end_datetime">End Date & Time</label>
            <input type="datetime-local" id="end_datetime" name="end_datetime"
                value="{{ session.end_datetime|date:'Y-m-d\TH:i' }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" min="1" value="{{ session.capacity }}" required>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn">Save Changes</button>
            <a href="{% url 'session_details' session.id %}" class="btn btn-secondary"
                style="text-align: center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
